syntax = "proto3";

package hangar.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

enum MergeMode {
  MERGE_MODE_UNSPECIFIED = 0;
  MERGE_MODE_PR = 1;
  MERGE_MODE_LOCAL = 2;
}

enum CodeRemote {
  CODE_REMOTE_UNSPECIFIED = 0;
  CODE_REMOTE_PROJECT = 1;
  CODE_REMOTE_TOWER = 2;
}

message Project {
  string id = 1;
  string name = 2;
  string remote_url = 3;
  string default_branch = 4;
  string setup_script = 5;
  string run_script = 6;
  string sandbox_image = 7;
  MergeMode merge_mode = 8;
  CodeRemote code_remote = 9;
  google.protobuf.Timestamp created_at = 10;
}

enum WorkspaceStatus {
  WORKSPACE_STATUS_UNSPECIFIED = 0;
  WORKSPACE_STATUS_CREATED = 1;
  WORKSPACE_STATUS_ACTIVE = 2;
  WORKSPACE_STATUS_IDLE = 3;
  WORKSPACE_STATUS_ARCHIVED = 4;
}

message Workspace {
  string id = 1;
  string project_id = 2;
  string name = 3;
  string slug = 4;
  string branch = 5;
  WorkspaceStatus status = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message Agent {
  string provider = 1;
  string model = 2;
  string effort = 3;
}

message Chat {
  string id = 1;
  string workspace_id = 2;
  string title = 3;
  Agent agent = 4;
  google.protobuf.Timestamp created_at = 5;
}

message Event {
  string id = 1;
  string chat_id = 2;
  optional int64 seq = 3;
  string author = 4;
  string machine_id = 5;
  google.protobuf.Timestamp created_at = 6;

  // Unset when the event type is newer than this schema; clients skip such events.
  oneof payload {
    UserMessage user_message = 10;
    TurnStarted turn_started = 11;
    AgentText agent_text = 12;
    ToolCall tool_call = 13;
    ToolResult tool_result = 14;
    TurnEnded turn_ended = 15;
  }
}

message UserMessage {
  string text = 1;
}

message TurnStarted {
  string turn_id = 1;
  repeated string message_ids = 2;
  Agent agent = 3;
}

message AgentText {
  string turn_id = 1;
  string text = 2;
}

message ToolCall {
  string turn_id = 1;
  string call_id = 2;
  string parent_call_id = 3;
  string name = 4;
  google.protobuf.Struct input = 5;
}

message ToolResult {
  string turn_id = 1;
  string call_id = 2;
  string output = 3;
  bool is_error = 4;
}

enum Outcome {
  OUTCOME_UNSPECIFIED = 0;
  OUTCOME_COMPLETED = 1;
  OUTCOME_INTERRUPTED = 2;
  OUTCOME_FAILED = 3;
}

message Usage {
  int64 input_tokens = 1;
  int64 output_tokens = 2;
  int64 cache_read_tokens = 3;
  int64 cache_write_tokens = 4;
}

message TurnEnded {
  string turn_id = 1;
  Outcome outcome = 2;
  string error = 3;
  int64 duration_ms = 4;
  Usage usage = 5;
  double cost_usd = 6;
  string commit = 7;
}
